name: Test Python

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Install dependencies
        run: uv sync --locked --extra docs --extra evidence --extra test
      - name: Check lint and formatting
        run: uvx pre-commit run --all-files --show-diff-on-failure
      - name: Check Pyright
        run: uvx pre-commit run pyright --all-files --hook-stage manual
      - name: Run Python tests
        run: uv run --no-sync pytest -q -rs

  minimum-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Build and install the base wheel
        run: |
          uv build --no-sources
          uv venv
          uv pip install dist/*.whl
          uv pip check
      - name: Check installed commands outside the source directory
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/tracecite-docs" --version
          "$GITHUB_WORKSPACE/.venv/bin/tracecite-docs" --help
          "$GITHUB_WORKSPACE/.venv/bin/python" -c 'from tracecite_docs import normalise_html_table; assert normalise_html_table("<table><tr><th>A</th></tr><tr><td>1</td></tr></table>").rows'
