[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecite-docs"
version = "0.0.1"
description = "Source-linked table normalisation and evidence retrieval for executable documentation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ARPST-UniMelb"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "tracecite>=0.0.3",
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
  "tabulate>=0.9",
]

[project.urls]
Documentation = "https://yasirroni.github.io/tracecite/"

[project.optional-dependencies]
# Quarto runs Python documentation pages through a Jupyter kernel.
docs = ["ipykernel>=7.3", "nbclient>=0.11", "nbformat>=5.10", "tracecite-docs[pandas]"]
evidence = ["tracecite[evidence]>=0.0.3"]
# knowledge_table and computed_first_row_summary take a pandas DataFrame.
pandas = ["pandas>=2.0"]
test = ["build>=1.2", "pytest>=8.4,<9", "tracecite-docs[pandas]"]

[project.scripts]
tracecite-docs = "tracecite_docs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tracecite_docs*"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
