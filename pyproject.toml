[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecite-docs"
version = "0.0.2"
description = "Quarto builds and source-linked table normalisation for executable Python and Julia pages"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ARPST-UniMelb"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "tracecite>=0.0.3",
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
  "tabulate>=0.9",
]

[project.urls]
Homepage = "https://github.com/yasirroni/tracecite-docs"
Documentation = "https://yasirroni.github.io/tracecite/"
Issues = "https://github.com/yasirroni/tracecite-docs/issues"

[project.optional-dependencies]
# Quarto runs Python documentation pages through a Jupyter kernel.
python = ["ipykernel>=7.3", "nbclient>=0.11", "nbformat>=5.10", "pandas>=2.0"]
evidence = ["tracecite[evidence]>=0.0.3"]
test = ["build>=1.2", "pytest>=8.4,<9"]

[project.scripts]
tracecite-docs = "tracecite_docs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tracecite_docs*"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
